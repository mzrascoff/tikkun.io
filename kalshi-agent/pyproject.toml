[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-agent"
version = "0.1.0"
description = "Science-grounded mispricing scanner for Kalshi prediction markets"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30"]

[project.scripts]
kalshi-agent = "kalshi_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
